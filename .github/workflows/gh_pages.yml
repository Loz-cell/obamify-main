name: Github Pages

# By default, runs if you push to main. keeps your deployed app in sync with main branch.
on:
  push:
    branches:
      - main
# to only run when you do a new github release, comment out above part and uncomment the below trigger.
# on:
#   release:
#     types:
#       - published

permissions:
  contents: write # for committing to gh-pages branch.

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  TRUNK_VERSION: "0.21.14"
  TRUNK_SHA256: "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"

jobs:
  build-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # repo checkout
      - name: Setup toolchain for wasm
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache # cache the rust build artefacts
        uses: Swatinem/rust-cache@v2
      - name: Download and install Trunk binary
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}"
          curl --fail --location --silent --show-error \
            --output trunk.tar.gz \
            "${base}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum --check -
          tar --extract --gzip --file trunk.tar.gz trunk
          ./trunk --version
      - name: Build # build
        # Environment $public_url resolves to the github project page.
        # If using a user/organization page, remove the `${{ github.event.repository.name }}` part.
        # using --public-url something will allow trunk to modify all the href paths like from favicon.ico to repo_name/favicon.ico .
        # this is necessary for github pages where the site is deployed to username.github.io/repo_name and all files must be requested
        # relatively as eframe_template/favicon.ico. if we skip public-url option, the href paths will instead request username.github.io/favicon.ico which
        # will obviously return error 404 not found.
        run: ./trunk build --release --public-url "$public_url"
        env:
          public_url: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Smoke test generated web assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          dist = Path("dist")
          required = ["index.html", "worker.js", "sw.js", "manifest.json"]
          missing = [name for name in required if not (dist / name).is_file()]
          assert not missing, f"missing generated assets: {missing}"

          modules = [
              path for path in dist.glob("obamify-*.js")
              if not path.name.endswith("_bg.js")
          ]
          assert len(modules) == 1, f"expected one hashed JS module, found: {modules}"
          module = modules[0]
          assert re.fullmatch(r"obamify-[A-Za-z0-9_-]+\.js", module.name), module.name
          wasm = dist / f"{module.stem}_bg.wasm"
          assert wasm.is_file(), f"missing matching WASM asset: {wasm.name}"

          html = (dist / "index.html").read_text(encoding="utf-8")
          assert module.name in html, "index.html does not reference the generated JS module"
          assert "worker.js" in html or (dist / "worker.js").is_file()

          worker = (dist / "worker.js").read_text(encoding="utf-8")
          assert "URLSearchParams" in worker and "script" in worker
          assert "_bg.wasm" in worker
          assert "/obamify-main/obamify" not in worker, "worker contains a deployment-specific path"

          manifest = json.loads((dist / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["start_url"].startswith("./")
          assert manifest["scope"].startswith("./")
          print(f"asset smoke test passed: {module.name} + {wasm.name}")
          PY
      - name: Browser smoke test worker startup
        shell: bash
        run: |
          set -euo pipefail
          module="$(basename "$(find dist -maxdepth 1 -type f -name 'obamify-*.js' | head -n 1)")"
          site_root="${RUNNER_TEMP}/portraitify-pages-smoke"
          app_root="${site_root}/${{ github.event.repository.name }}"
          mkdir -p "$app_root"
          cp -a dist/. "$app_root/"

          MODULE_NAME="$module" APP_ROOT="$app_root" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          module = os.environ["MODULE_NAME"]
          app_root = Path(os.environ["APP_ROOT"])
          module_literal = json.dumps(f"./{module}")
          page = f"""<!doctype html>
          <html><body data-result="pending">
          <script type="module">
          const worker = new Worker(
            './worker.js?script=' + encodeURIComponent({module_literal}),
            {{ type: 'module' }},
          );
          const timer = setTimeout(() => {{
            document.body.dataset.result = 'timeout';
            worker.terminate();
          }}, 10000);
          worker.onmessage = () => {{
            clearTimeout(timer);
            document.body.dataset.result = 'ready';
            worker.terminate();
          }};
          worker.onerror = (event) => {{
            clearTimeout(timer);
            document.body.dataset.result = 'error';
            document.body.textContent = event.message || 'worker startup failed';
          }};
          </script></body></html>"""
          (app_root / "worker-smoke.html").write_text(page, encoding="utf-8")
          PY

          python3 -m http.server 8123 --bind 127.0.0.1 --directory "$site_root" \
            >"${RUNNER_TEMP}/portraitify-pages-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          smoke_url="http://127.0.0.1:8123/${{ github.event.repository.name }}/worker-smoke.html"
          for _ in {1..20}; do
            curl --fail --silent "$smoke_url" >/dev/null && break
            sleep 0.25
          done

          timeout 30s google-chrome --headless=new --no-sandbox --disable-gpu \
            --virtual-time-budget=15000 --dump-dom "$smoke_url" \
            >"${RUNNER_TEMP}/portraitify-pages-worker-smoke.html"
          grep -q 'data-result="ready"' "${RUNNER_TEMP}/portraitify-pages-worker-smoke.html" || {
            cat "${RUNNER_TEMP}/portraitify-pages-worker-smoke.html"
            cat "${RUNNER_TEMP}/portraitify-pages-http.log"
            exit 1
          }
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          # this option will not maintain any history of your previous pages deployment
          # set to false if you want all page build to be committed to your gh-pages branch history
          single-commit: true
